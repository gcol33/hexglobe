[package]
name = "hexglobe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "lib.rs"

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "0.4"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
